# Точные версии (docs/development.md, «Политика зависимостей и supply-chain»).
# AGP 8.7.x ↔ Gradle 8.9+ ↔ Kotlin 2.0.x — проверенная связка; compileSdk 35
# и build-tools 35.0.0 стоят на стенде, AGP их не докачивает.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
junit = "4.13.2"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
# Реальная реализация org.json (на устройстве он часть Android SDK). В
# android.jar для JVM-тестов org.json — заглушка, бросающая «Stub!», поэтому
# для unit-тестов Protocol подкладываем настоящий org.json ТОЛЬКО в testImplementation.
# Это не новая рантайм-зависимость: приложение использует системный org.json.
json = "20231013"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
