name: Release

# H11 (docs/roadmap-next.md): на тег vX.Y.Z — GitHub Release с release notes из
# CHANGELOG.md и SBOM (CycloneDX). Порядок выпуска — docs/development.md,
# «Выпуск релиза». H3: Linux-агент (tar.gz, .deb, .rpm) собирается здесь же,
# SHA256SUMS всех файлов релиза подписывается cosign без ключа (OIDC этого
# workflow, Sigstore). Windows-агент (zip и MSI без настроек, без Authenticode —
# подписывает install-server.sh своим сертификатом при сборке комплекта) и
# Android-агент (APK без подписи — тоже подписывает install-server.sh)
# собирается здесь же: ffmpeg.exe — закреплённая версия (tools/fetch-ffmpeg.sh),
# MSI — wixl на Linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # cosign keyless: сертификат Sigstore выдаётся на OIDC-токен этого workflow.
  id-token: write

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  CYCLONEDX_VERSION: "6.2.0"
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Версия из тега = Directory.Build.props
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          props="$(grep -oP '<ServerVersion>\K[^<]+' Directory.Build.props)"
          if [ "$version" != "$props" ]; then
            echo "::error::Тег $tag не совпадает с <ServerVersion>$props</ServerVersion> в Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes из CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::В CHANGELOG.md нет раздела ## [$VERSION] — перенесите туда [Unreleased] перед тегом"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: SBOM — NuGet-зависимости решения
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet tool install --global CycloneDX --version "$CYCLONEDX_VERSION"
          mkdir -p sbom
          dotnet-CycloneDX Watcher.sln --exclude-test-projects --exclude-dev \
            -o sbom -fn "watcher-$VERSION-dotnet.cdx.json" -F Json \
            --set-name watcher --set-version "$VERSION"

      - name: Docker-образ сервера
        run: docker build -f src/Watcher.Server/Dockerfile -t "watcher-server:${{ steps.ver.outputs.version }}" .

      - name: Trivy — gate и SBOM образа
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "watcher-server:$VERSION"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" "$TRIVY_IMAGE" \
            image --format cyclonedx --output "/out/watcher-server-$VERSION-image.cdx.json" "watcher-server:$VERSION"

      - name: Linux-агент — tar.gz, .deb, .rpm
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 120 -fsSLo nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tgz" | sha256sum -c
          tar -xzf nfpm.tgz nfpm && sudo install nfpm /usr/local/bin/ && rm nfpm nfpm.tgz
          DOTNET=dotnet ./make-bundle-linux.sh --packages

      - name: Windows-агент — zip, MSI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wixl msitools
          DOTNET=dotnet ./make-bundle.sh --msi

      # APK без подписи: его подписывает install-server.sh ключом APK сервера
      # (tools/android-signing) — тем же на всех обновлениях этого сервера.
      - name: Android-агент — APK без подписи
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          (cd android && ./gradlew --no-daemon assembleRelease)
          version="$(grep -oP '<AgentVersion>\K[^<]+' Directory.Build.props)"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/watcher-agent-$version.apk"

      - name: Установочный архив сервера (образы, готовые агенты)
        run: ./make-server-bundle.sh

      - uses: sigstore/cosign-installer@v4.1.3

      # Проверка у получателя — docs/install.md, «Проверка подлинности релиза».
      # Публичный журнал Sigstore (Rekor) получает имя репозитория, workflow,
      # тег и хеш SHA256SUMS — не код и не сами файлы.
      - name: SHA256SUMS + подпись cosign
        run: |
          mkdir -p release
          cp dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.zip dist/*.msi sbom/*.cdx.json release/
          ( cd release && sha256sum -- * > SHA256SUMS )
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Watcher $VERSION" \
            --notes-file release-notes.md release/*
